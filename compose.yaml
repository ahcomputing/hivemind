services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?set in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["8080:8080"]
    depends_on:
      elasticsearch:
        condition: service_healthy
