services:
  robohash:
    image: ghcr.io/e1ven/robohash:v2.1@sha256:2bb0b5d4d153149fb3b790b67da74c1036fe8209a3378795080bd67cf62116a4
    environment:
      PORT: "8080"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs: [/tmp]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?set in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      AVATAR_SERVICE_URL: http://robohash:8080
    ports: ["8080:8080"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      robohash:
        condition: service_started
