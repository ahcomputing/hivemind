<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0a1424;
    --panel: #101d33;
    --panel-2: #16273f;
    --line: #22364f;
    --ink: #dce6f2;
    --muted: #8aa0bb;
    --blue: #35b6ff;
    --green: #2ee6a0;
    --amber: #ffb020;
    --red: #ff5c5c;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 4rem;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.6;
  }
  .wrap { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 2rem; font-size: .95rem; }
  h2 {
    font-size: 1.05rem; margin: 2.5rem 0 .9rem; padding-bottom: .5rem;
    border-bottom: 1px solid var(--line); color: var(--blue);
    letter-spacing: .02em;
  }
  .warn {
    background: #2a1a10; border: 1px solid #6b4415; border-left: 3px solid var(--amber);
    padding: 1rem 1.15rem; border-radius: 6px; margin-bottom: 1.5rem;
  }
  .warn strong { color: var(--amber); }
  .note {
    background: var(--panel); border-left: 3px solid var(--blue);
    padding: .85rem 1.1rem; border-radius: 6px; margin: 1rem 0;
    font-size: .93rem; color: var(--muted);
  }
  .note b { color: var(--ink); font-weight: 600; }
  .item {
    display: flex; gap: .85rem; align-items: flex-start;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: .95rem 1.1rem; margin-bottom: .7rem;
  }
  .item.done { opacity: .5; }
  .item.done .label { text-decoration: line-through; }
  input[type=checkbox] {
    appearance: none; flex: 0 0 auto; width: 1.15rem; height: 1.15rem;
    margin-top: .28rem; border: 2px solid var(--line); border-radius: 4px;
    background: var(--panel-2); cursor: pointer; position: relative;
  }
  input[type=checkbox]:checked { background: var(--green); border-color: var(--green); }
  input[type=checkbox]:checked::after {
    content: "✓"; position: absolute; inset: 0; color: #06251a;
    font-size: .85rem; font-weight: 700; display: grid; place-items: center;
  }
  .body { flex: 1; min-width: 0; }
  .label { font-weight: 600; display: block; margin-bottom: .15rem; }
  .expect { color: var(--muted); font-size: .9rem; }
  .expect .eyes { color: var(--amber); font-weight: 600; }
  pre {
    font-family: var(--mono); font-size: .82rem; background: #06101d;
    border: 1px solid var(--line); border-radius: 6px;
    padding: .7rem .85rem; margin: .6rem 0 0; overflow-x: auto;
    color: #a9e6ff; white-space: pre; line-height: 1.5;
  }
  code { font-family: var(--mono); font-size: .88em; color: var(--green); }
  .bar {
    position: sticky; top: 0; z-index: 5; background: rgba(10,20,36,.94);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    margin: -2.5rem -1.25rem 2rem; padding: .8rem 1.25rem;
    display: flex; align-items: center; gap: 1rem; font-family: var(--mono);
    font-size: .85rem;
  }
  .track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--green); transition: width .25s; }
  button {
    font-family: var(--mono); font-size: .78rem; background: transparent;
    color: var(--muted); border: 1px solid var(--line); border-radius: 5px;
    padding: .35rem .7rem; cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--blue); }
  footer {
    margin-top: 3.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .85rem; display: flex;
    justify-content: space-between; flex-wrap: wrap; gap: .5rem;
  }
  @media (max-width: 34rem) { .bar span.lbl { display: none; } }
</style>

<div class="wrap">
  <div class="bar">
    <span class="lbl">PROGRESS</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span id="count">0 / 0</span>
    <button onclick="if(confirm('Clear all checkmarks?')){localStorage.removeItem('{{STORAGE_KEY}}');location.reload()}">reset</button>
  </div>

  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}} Progress saves in this browser.</p>

  {{BANNERS}}

  <h2>Setup</h2>
  <div class="note">
    {{SETUP_TEXT}}
    <pre>{{SETUP_COMMANDS}}</pre>
  </div>

  <div id="list"></div>

  <footer>
    <span>{{FOOTER_LEFT}}</span>
    <span>admin@ahcomputing.com</span>
  </footer>
</div>

<script>
const TESTS = {{TESTS}};

const KEY = "{{STORAGE_KEY}}";
const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
const list = document.getElementById("list");
let total = 0;

TESTS.forEach(([section, items], si) => {
  const h = document.createElement("h2");
  h.textContent = section;
  list.appendChild(h);
  items.forEach(([label, expect, cmd], ii) => {
    const id = `t${si}-${ii}`;
    total++;
    const row = document.createElement("div");
    row.className = "item" + (saved[id] ? " done" : "");
    row.innerHTML = `
      <input type="checkbox" id="${id}" ${saved[id] ? "checked" : ""}>
      <div class="body">
        <label class="label" for="${id}">${label}</label>
        ${expect ? `<div class="expect">${expect}</div>` : ""}
        ${cmd ? `<pre>${cmd.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>` : ""}
      </div>`;
    list.appendChild(row);
  });
});

function refresh() {
  const done = Object.values(saved).filter(Boolean).length;
  document.getElementById("count").textContent = `${done} / ${total}`;
  document.getElementById("fill").style.width = (done / total * 100) + "%";
}

list.addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  saved[e.target.id] = e.target.checked;
  e.target.closest(".item").classList.toggle("done", e.target.checked);
  localStorage.setItem(KEY, JSON.stringify(saved));
  refresh();
});

refresh();
</script>
