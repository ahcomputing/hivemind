<section class="card" aria-labelledby="share-heading"><h1 id="share-heading">Share an update</h1><p class="subtitle">Tell nearby attendees what you are seeing or scheduling.</p><form id="report-form"><label for="content">Update <span>(up to 500 characters)</span></label><textarea id="content" maxlength="500" required placeholder="Coffee line is moving fast near…"></textarea><div class="form-grid"><div><label for="location">Location <span>(optional)</span></label><input id="location" maxlength="120" placeholder="Room or landmark"></div><div><label for="category">Category</label><select id="category"><option value="general">General</option><option value="coffee">Coffee</option><option value="help">Help wanted</option><option value="accessibility">Accessibility</option><option value="demo">Live demo</option></select></div></div><div class="form-grid"><div><label for="starts-at">Starts at <span>(optional, Mountain time; defaults to now)</span></label><input id="starts-at" type="datetime-local"></div><div><label for="expiry">Expires</label><select id="expiry"><option value="15m">15 minutes</option><option value="30m">30 minutes</option><option value="45m">45 minutes</option><option value="1h" selected>One hour</option><option value="75m">75 minutes</option><option value="90m">90 minutes</option><option value="105m">105 minutes</option><option value="120m">120 minutes</option><option value="end_of_day">End of day</option><option value="custom">Custom time</option></select></div></div><p class="muted">Relative expiration starts at the selected start time. Times are shown in Mountain time.</p><div id="custom-expiry-wrap" hidden><label for="custom-expiry">Custom expiration <span>(Mountain time)</span></label><input id="custom-expiry" type="datetime-local"></div><button type="submit">Post update</button><p id="form-status" role="status" aria-live="polite"></p></form></section>
