# Do not apply this file. Create the real Secret out of band after approval:
# kubectl -n hivemind create secret generic hivemind-secrets ...
apiVersion: v1
kind: Secret
metadata:
  name: hivemind-secrets
  namespace: hivemind
type: Opaque
stringData:
  APP_SECRET: CHANGE_ME
  ELASTICSEARCH_USERNAME: elastic
  ELASTICSEARCH_PASSWORD: CHANGE_ME
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: CHANGE_ME
  # The header value is e.g. authorization=Bearer auth_REPLACE_ME,dash0-dataset=default
  OTEL_EXPORTER_OTLP_HEADERS: CHANGE_ME
