# Self-hosted RoboHash: upstream's own published image, pinned by digest.
#
# The Python code is MIT; the artwork is Creative Commons per set and is
# attributed in the HiveMind UI footer and README. set1 ("classic robots") is
# Zikri Kader, CC-BY. Upstream explicitly permits self-hosting and asks that
# we say where the images came from.
#
# Stateless: images are composited in memory and nothing is written to disk,
# so there is no PVC and no storage class to get wrong.
#
# The image is linux/amd64 only, hence the nodeSelector -- it turns a possible
# "exec format error" CrashLoop into a clean Pending with a readable event.
#
# There is NO health endpoint. The app's route table ends in a catch-all that
# renders a robot for any path, so /healthz would return a PNG. The probes
# therefore request a tiny real render: that exercises Tornado AND Pillow AND
# the bundled artwork, which is a far better readiness signal than a TCP open.
apiVersion: v1
kind: Service
metadata:
  name: robohash
  namespace: robohash
spec:
  selector: {app.kubernetes.io/name: robohash}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robohash
  namespace: robohash
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: robohash}}
  template:
    metadata: {labels: {app.kubernetes.io/name: robohash}}
    spec:
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: robohash
          image: ghcr.io/e1ven/robohash:v2.1@sha256:2bb0b5d4d153149fb3b790b67da74c1036fe8209a3378795080bd67cf62116a4
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            # HOME and the bytecode switch keep a hardened read-only root
            # filesystem from tripping CPython's cache and config writes.
            - {name: PORT, value: "8080"}
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe: {httpGet: {path: "/startup-probe.png?size=16x16", port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: "/ready-probe.png?size=16x16", port: http}, periodSeconds: 15}
          livenessProbe: {httpGet: {path: "/live-probe.png?size=16x16", port: http}, periodSeconds: 30}
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}]
