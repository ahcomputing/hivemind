apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind
  namespace: hivemind
  annotations:
    # Public TLS terminates at the mailserver Nginx ingress. Traefik receives
    # traffic only across the private LAN from that trusted reverse proxy.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: hivemind.ahcomputing.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hivemind, port: {name: http}}}
